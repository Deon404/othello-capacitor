<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othello - Main Menu</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts are bundled locally (see style.css @font-face) so the heading
         renders correctly even on the very first launch with zero network. -->
    <script src="shared.js"></script>
    <style>
        /* index.html — only page-specific overrides; the base look comes from style.css */
        body {
            justify-content: center;
            padding: 20px;
            padding-bottom: 5rem;
        }

        /* Stats display on main menu — glass mini-card */
        .stats-display {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 0.5rem auto 1.5rem;
            padding: 0.9rem 1.1rem;
            background: rgba(17, 4, 74, 0.45);
            border: 1.5px solid rgba(255, 215, 0, 0.18);
            border-radius: 14px;
            max-width: 440px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* Total card — the hero row showing all-modes aggregate. */
        .stats-total {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 0.5rem 1rem;
            padding: 0.6rem 0.75rem;
            background: linear-gradient(135deg,
                rgba(255, 215, 0, 0.12) 0%,
                rgba(255, 149, 0, 0.08) 100%);
            border: 1px solid rgba(255, 215, 0, 0.30);
            border-radius: 10px;
        }
        .stats-total-header {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .stats-total-title {
            font-family: 'Fredoka One', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 0.4px;
        }
        .stats-total-games {
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
        }
        .stats-total-winrate {
            font-family: 'Fredoka One', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary, #fff);
            font-size: 1.25rem;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.45);
        }
        .stats-total-winrate small {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-left: 0.15rem;
        }
        .stats-total-breakdown {
            grid-column: 1 / -1;
            display: flex;
            gap: 0.65rem;
            font-size: 0.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }
        .stats-total-breakdown .pill-w { color: #6EE7B7; }
        .stats-total-breakdown .pill-l { color: #FCA5A5; }
        .stats-total-breakdown .pill-d { color: #FCD34D; }

        /* Per-mode breakdown grid */
        .stats-breakdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.4rem 1rem;
        }
        .stats-breakdown .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-primary);
            padding: 0.15rem 0;
        }
        .stats-breakdown .stat-label {
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 0.3px;
        }
        .stats-breakdown .stat-value {
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            font-weight: 700;
        }
        @media (max-width: 420px) {
            .stats-breakdown { grid-template-columns: 1fr; gap: 0.25rem 0; }
            .stats-total-winrate { font-size: 1.1rem; }
            .stats-display {
                padding: 0.8rem 0.9rem;
                margin: 0.4rem auto 1.1rem;
                gap: 0.6rem;
            }
            .stats-total { padding: 0.55rem 0.7rem; gap: 0.4rem 0.8rem; }
        }
        @media (max-width: 340px) {
            .stats-total-title { font-size: 0.9rem; }
            .stats-total-games { font-size: 0.75rem; }
            .stats-breakdown .stat-item { font-size: 0.8rem; }
        }

        /* Hide sections other than main menu by default */
        #bot-difficulty-options,
        #player-setup {
            display: none;
        }

        .menu-container button {
            min-width: 250px;
            width: 100%;
            max-width: 260px;
        }

        /* Candy Crush-style Story Mode Button — pink/orange shimmery pill */
        .story-mode-btn {
            background: linear-gradient(135deg, #FF6B9D 0%, #FF9500 100%) !important;
            color: #ffffff !important;
            border-radius: 50px !important;
            font-family: 'Fredoka One', 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif !important;
            font-size: 1.25rem !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.35) !important;
            box-shadow: 0 6px 15px rgba(255, 107, 157, 0.45), 0 4px 0 #c44773 !important;
            border: 2px solid #FFF !important;
            animation: story-pulse-glow 2.2s infinite alternate;
            position: relative;
            top: 0;
        }
        .story-mode-btn:hover {
            top: 2px !important;
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.6), 0 2px 0 #c44773 !important;
            filter: brightness(1.06);
        }
        .story-mode-btn:active {
            top: 4px !important;
            box-shadow: 0 0 0 #c44773 !important;
            animation: cc-bounce 0.35s ease;
        }
        @keyframes story-pulse-glow {
            0%   { box-shadow: 0 6px 15px rgba(255, 107, 157, 0.45), 0 4px 0 #c44773, 0 0 5px rgba(255, 107, 157, 0.2); }
            100% { box-shadow: 0 6px 22px rgba(255, 107, 157, 0.75), 0 4px 0 #c44773, 0 0 18px rgba(255, 149, 0, 0.55); }
        }

         @media (max-width: 600px) {
              .menu-container button { min-width: 220px; max-width: 260px; }
         }
         @media (max-width: 400px) {
              /* Let buttons stretch edge-to-edge inside the container on
                 narrow phones so taps target a larger area. */
              .menu-container button {
                  min-width: 0;
                  max-width: 100%;
                  width: 100%;
              }
         }
    </style>
</head>
<body>
    <div id="container">
        <h1>Voidllo</h1>

        <!-- Stats Display: combined total on top, per-mode breakdown below -->
        <div id="stats-display" class="stats-display" aria-label="Game statistics">
            <div class="stats-total" role="group" aria-label="Overall stats">
                <div class="stats-total-header">
                    <span class="stats-total-title">Total</span>
                    <span id="stat-total-games" class="stats-total-games">0 games</span>
                </div>
                <div class="stats-total-winrate">
                    <span id="stat-winrate">0</span><small>% win</small>
                </div>
                <div class="stats-total-breakdown" aria-label="Wins, losses, draws">
                    <span class="pill-w"><span id="stat-total-w">0</span>W</span>
                    <span class="pill-l"><span id="stat-total-l">0</span>L</span>
                    <span class="pill-d"><span id="stat-total-d">0</span>D</span>
                </div>
            </div>
            <div class="stats-breakdown">
                <div class="stat-item">
                    <span class="stat-label">Easy</span>
                    <span id="stat-easy" class="stat-value">0W 0L 0D</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Medium</span>
                    <span id="stat-medium" class="stat-value">0W 0L 0D</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Hard</span>
                    <span id="stat-hard" class="stat-value">0W 0L 0D</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">PvP</span>
                    <span id="stat-pvp" class="stat-value">0W 0L 0D</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Online</span>
                    <span id="stat-online" class="stat-value">0W 0L 0D</span>
                </div>
            </div>
        </div>

        <!-- Main Menu Options -->
        <div class="menu-container main-menu-options">
            <button onclick="location.href='levels.html'" class="story-mode-btn">🍬 Story Mode</button>
            <button id="play-bot-select">Player vs Bot</button>
            <button id="play-plr-select">Player vs Player</button>
            <button onclick="location.href='online.html'">Play Online</button>
            <button onclick="location.href='settings.html'">Settings</button>
        </div>

        <!-- Bot Difficulty Options (Initially Hidden) -->
        <div class="menu-container" id="bot-difficulty-options">
             <h2>Select Bot Difficulty</h2>
            <button data-difficulty="easy">Easy</button>
            <button data-difficulty="medium">Medium</button>
            <button data-difficulty="hard">Hard</button>
            <button id="back-to-main-menu">Back</button>
        </div>

         <!-- Player vs Player Setup (Initially Hidden) -->
         <div class="menu-container" id="player-setup">
             <h2>Player Setup</h2>
             <div class="player-input-group">
                 <label for="player1-name">Player 1 Name:</label>
                 <input type="text" id="player1-name" placeholder="Enter name">
             </div>
              <div class="player-input-group">
                 <label for="player2-name">Player 2 Name:</label>
                 <input type="text" id="player2-name" placeholder="Enter name">
             </div>
             <div class="player-input-group">
                 <label for="time-limit">Time per move:</label>
                 <select id="time-limit">
                     <option value="0">Unlimited</option>
                     <option value="15">15 seconds</option>
                     <option value="30" selected>30 seconds</option>
                     <option value="60">60 seconds</option>
                     <option value="90">90 seconds</option>
                 </select>
             </div>
             <div class="color-choice">
                 <span>Player 1 chooses:</span>
                 <label><input type="radio" name="player1-color" value="black" checked> <span>Black</span></label>
                 <label><input type="radio" name="player1-color" value="white"> <span>White</span></label>
             </div>
             <button id="start-pvp-game">Start Game</button>
             <button id="back-from-player-setup">Back</button>
         </div>
    </div>

    <footer>
        <a style="color: rgb(175, 175, 175); text-decoration: none;" href="https://www.instagram.com/sidonstudio/">Developed by @SidonStudio</a>
    </footer>

    <script>
        // Load and display win/loss stats. Uses the centralized OthelloStats
        // helper (shared.js) which aggregates every mode into a total and a
        // win-rate %, with backward-compat for the old localStorage keys.
        function loadStats() {
            const data = (window.OthelloStats && window.OthelloStats.getAll)
                ? window.OthelloStats.getAll()
                : { buckets: { easy:{w:0,l:0,d:0}, medium:{w:0,l:0,d:0}, hard:{w:0,l:0,d:0}, pvp:{w:0,l:0,d:0}, online:{w:0,l:0,d:0} },
                    total: {w:0,l:0,d:0}, games: 0, winRate: 0 };

            const fmt = b => `${b.w}W ${b.l}L ${b.d}D`;
            const setText = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            };

            setText('stat-easy',   fmt(data.buckets.easy));
            setText('stat-medium', fmt(data.buckets.medium));
            setText('stat-hard',   fmt(data.buckets.hard));
            setText('stat-pvp',    fmt(data.buckets.pvp));
            setText('stat-online', fmt(data.buckets.online));

            setText('stat-total-games', `${data.games} game${data.games !== 1 ? 's' : ''}`);
            setText('stat-total-w', data.total.w);
            setText('stat-total-l', data.total.l);
            setText('stat-total-d', data.total.d);
            setText('stat-winrate', data.winRate);
        }
        loadStats();

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();

            const mainMenuOptions = document.querySelector('.main-menu-options');
            const botDifficultyOptions = document.getElementById('bot-difficulty-options');
            const playerSetupOptions = document.getElementById('player-setup');

            const playBotSelectButton = document.getElementById('play-bot-select');
            const playPlrSelectButton = document.getElementById('play-plr-select');
            const backFromBotButton = document.getElementById('back-to-main-menu');
            const backFromPlayerSetupButton = document.getElementById('back-from-player-setup');

            const difficultyButtons = botDifficultyOptions.querySelectorAll('button[data-difficulty]');
            const startGameButton = document.getElementById('start-pvp-game');

            function showContainer(containerToShow) {
                 mainMenuOptions.style.display = 'none';
                 botDifficultyOptions.style.display = 'none';
                 playerSetupOptions.style.display = 'none';

                 if(containerToShow) {
                     containerToShow.style.display = 'flex';
                 }
            }


            if (playBotSelectButton) {
                playBotSelectButton.addEventListener('click', () => {
                    showContainer(botDifficultyOptions);
                });
            }

             if (playPlrSelectButton) {
                 playPlrSelectButton.addEventListener('click', () => {
                     showContainer(playerSetupOptions);
                 });
             }


            if (backFromBotButton) {
                 backFromBotButton.addEventListener('click', () => {
                     showContainer(mainMenuOptions);
                 });
            }
             if (backFromPlayerSetupButton) {
                  backFromPlayerSetupButton.addEventListener('click', () => {
                     showContainer(mainMenuOptions);
                 });
             }


            difficultyButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const difficulty = button.dataset.difficulty;
                    window.location.href = `othellobot.html?difficulty=${difficulty}`;
                });
            });


             if (startGameButton) {
                 startGameButton.addEventListener('click', () => {
                     const player1NameInput = document.getElementById('player1-name');
                     const player2NameInput = document.getElementById('player2-name');
                     const player1ColorRadio = document.querySelector('input[name="player1-color"]:checked');
                     const timeLimitSelect = document.getElementById('time-limit');

                     const player1Name = player1NameInput.value.trim() || 'Player 1';
                     const player2Name = player2NameInput.value.trim() || 'Player 2';
                     const player1Color = player1ColorRadio ? player1ColorRadio.value : 'black';

                     const player2Color = (player1Color === 'black') ? 'white' : 'black';

                     const playerSetupData = {
                         player1Name: player1Name,
                         player1Color: player1Color,
                         player2Name: player2Name,
                         player2Color: player2Color,
                         timeLimitSeconds: parseInt(timeLimitSelect.value, 10)
                     };
                     localStorage.setItem('othelloPlayerSetup', JSON.stringify(playerSetupData));

                     window.location.href = 'othelloplr.html';
                 });
             }


        }); // End DOMContentLoaded
     </script>

</body>
</html>
