<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Moonstone Disc">
  <title>Moonstone Disc</title>
  <desc>Luminous moonstone disc with a vivid sapphire-blue adularescence flash, lavender accent cloud, silver inclusion veining, crystalline sparkles, and a glossy top-left specular highlight.</desc>

  <defs>
    <!-- Pearly moonstone body: bright pearly white centre fading to a stronger blue rim -->
    <radialGradient id="ms-body" cx="0.40" cy="0.30" r="0.92">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#eaf3ff"/>
      <stop offset="0.45" stop-color="#b5d2ff"/>
      <stop offset="0.80" stop-color="#5d86c8"/>
      <stop offset="1"    stop-color="#1f3a72"/>
    </radialGradient>

    <!-- Strong sapphire adularescence flash: the signature moonstone blue glow -->
    <radialGradient id="ms-adular" cx="0.55" cy="0.55" r="0.55">
      <stop offset="0"    stop-color="#9ec9ff" stop-opacity="0.95"/>
      <stop offset="0.30" stop-color="#5fa0ff" stop-opacity="0.80"/>
      <stop offset="0.65" stop-color="#2a64d8" stop-opacity="0.40"/>
      <stop offset="0.95" stop-color="#0a2870" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#000d33" stop-opacity="0"/>
    </radialGradient>

    <!-- Bold lavender accent cloud (lower-left) -->
    <radialGradient id="ms-lavender" cx="0.28" cy="0.68" r="0.36">
      <stop offset="0"    stop-color="#c8b8ff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#8868d8" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#3a1c80" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal-cyan accent (upper-right) -->
    <radialGradient id="ms-teal" cx="0.72" cy="0.30" r="0.28">
      <stop offset="0"    stop-color="#b8f0ff" stop-opacity="0.75"/>
      <stop offset="0.6"  stop-color="#4ec2e8" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#0a5a88" stop-opacity="0"/>
    </radialGradient>

    <!-- Rim shading: deeper so the disc reads clearly against any felt -->
    <radialGradient id="ms-rim-shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.74" stop-color="#1a2c58" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#0e1c40" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#050b22" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Main glossy specular highlight -->
    <radialGradient id="ms-spec-main" cx="0.30" cy="0.22" r="0.30">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#e8f4ff" stop-opacity="0.50"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Counter-highlight (bottom-right) -->
    <radialGradient id="ms-spec-small" cx="0.7" cy="0.78" r="0.18">
      <stop offset="0"    stop-color="#d8eaff" stop-opacity="0.55"/>
      <stop offset="0.6"  stop-color="#9ec0e8" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground shadow -->
    <radialGradient id="ms-shadow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Crystalline sparkle glow -->
    <radialGradient id="ms-spark-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#c8e0ff" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#5a9aff" stop-opacity="0"/>
    </radialGradient>

    <!-- Silver inclusion vein gradient -->
    <linearGradient id="ms-vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5"  stop-color="#b5cce8" stop-opacity="0.65"/>
      <stop offset="1"    stop-color="#3e5a88" stop-opacity="0.20"/>
    </linearGradient>

    <clipPath id="ms-clip">
      <circle cx="160" cy="160" r="113"/>
    </clipPath>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="160" cy="175" rx="120" ry="118" fill="url(#ms-shadow)"/>

  <!-- main moonstone body -->
  <circle cx="160" cy="160" r="115" fill="url(#ms-body)"/>

  <!-- Adularescence + accent clouds + inclusions, clipped to the disc -->
  <g clip-path="url(#ms-clip)">
    <!-- vivid sapphire adularescence flash -->
    <rect x="45" y="45" width="230" height="230" fill="url(#ms-adular)"/>
    <!-- lavender accent (lower-left) -->
    <rect x="45" y="45" width="230" height="230" fill="url(#ms-lavender)"/>
    <!-- teal accent (upper-right) -->
    <rect x="45" y="45" width="230" height="230" fill="url(#ms-teal)"/>

    <!-- silver inclusion veins (now clearly visible) -->
    <g stroke="url(#ms-vein)" fill="none" stroke-linecap="round">
      <path d="M75,205 C115,178 160,195 215,158" stroke-width="3.2" opacity="0.85"/>
      <path d="M100,238 C138,215 178,228 222,205" stroke-width="2.4" opacity="0.70"/>
      <path d="M85,128 C118,118 152,140 200,118" stroke-width="2.2" opacity="0.65"/>
      <path d="M148,82 C160,118 138,150 165,178" stroke-width="1.8" opacity="0.55"/>
      <path d="M212,90 C202,128 228,158 215,200" stroke-width="1.6" opacity="0.50"/>
    </g>

    <!-- crystalline sparkle halos -->
    <circle cx="120" cy="148" r="8"   fill="url(#ms-spark-glow)"/>
    <circle cx="200" cy="120" r="6.5" fill="url(#ms-spark-glow)"/>
    <circle cx="175" cy="210" r="6.5" fill="url(#ms-spark-glow)"/>
    <circle cx="232" cy="190" r="5"   fill="url(#ms-spark-glow)"/>
    <circle cx="95"  cy="180" r="5"   fill="url(#ms-spark-glow)"/>
    <circle cx="148" cy="240" r="4.5" fill="url(#ms-spark-glow)"/>

    <!-- bright sparkle cores -->
    <circle cx="120" cy="148" r="1.8" fill="#ffffff"/>
    <circle cx="200" cy="120" r="1.6" fill="#ffffff"/>
    <circle cx="175" cy="210" r="1.6" fill="#ffffff"/>
    <circle cx="232" cy="190" r="1.3" fill="#ffffff"/>
    <circle cx="95"  cy="180" r="1.3" fill="#ffffff"/>
    <circle cx="148" cy="240" r="1.2" fill="#ffffff"/>

    <!-- scattered micro sparkles -->
    <circle cx="138" cy="105" r="1.1" fill="#ffffff" opacity="0.95"/>
    <circle cx="160" cy="128" r="1.0" fill="#eaf2ff" opacity="0.85"/>
    <circle cx="192" cy="158" r="1.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="218" cy="228" r="1.0" fill="#eaf2ff" opacity="0.80"/>
    <circle cx="102" cy="118" r="0.9" fill="#ffffff" opacity="0.80"/>
    <circle cx="82"  cy="162" r="1.0" fill="#eaf2ff" opacity="0.75"/>
    <circle cx="244" cy="158" r="0.9" fill="#ffffff" opacity="0.80"/>
    <circle cx="140" cy="182" r="0.8" fill="#ffffff" opacity="0.70"/>
    <circle cx="198" cy="240" r="0.9" fill="#ffffff" opacity="0.80"/>
    <circle cx="115" cy="222" r="0.8" fill="#eaf2ff" opacity="0.70"/>
    <circle cx="222" cy="100" r="0.9" fill="#ffffff" opacity="0.85"/>
    <circle cx="80"  cy="122" r="0.7" fill="#ffffff" opacity="0.65"/>
    <circle cx="250" cy="220" r="0.8" fill="#ffffff" opacity="0.70"/>
    <circle cx="168" cy="80"  r="0.8" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- inner rim shading -->
  <circle cx="160" cy="160" r="115" fill="url(#ms-rim-shade)"/>

  <!-- top-left specular highlight (glossy gloss) -->
  <ellipse cx="120" cy="105" rx="52" ry="34" fill="url(#ms-spec-main)"/>

  <!-- subtle bottom-right counter-highlight -->
  <ellipse cx="208" cy="220" rx="32" ry="18" fill="url(#ms-spec-small)"/>

  <!-- tight white hotspot -->
  <ellipse cx="118" cy="98" rx="14" ry="6.5" fill="#ffffff" fill-opacity="0.92"/>

  <!-- outer rim line -->
  <circle cx="160" cy="160" r="115" fill="none" stroke="#1a2848" stroke-opacity="0.75" stroke-width="2"/>
</svg>
