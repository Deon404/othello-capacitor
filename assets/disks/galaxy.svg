<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Galaxy Void Disc">
  <title>Galaxy Void Disc</title>
  <desc>Deep cosmic black disc with a soft purple-pink nebula cloud, a scattering of tiny white stars, and a glossy top-left specular highlight.</desc>

  <defs>
    <!-- Deep void body: jet black with a faint indigo lift toward the upper-left -->
    <radialGradient id="gx-body" cx="0.38" cy="0.30" r="0.85">
      <stop offset="0"    stop-color="#1a1235"/>
      <stop offset="0.22" stop-color="#0d0820"/>
      <stop offset="0.55" stop-color="#050310"/>
      <stop offset="1"    stop-color="#000000"/>
    </radialGradient>

    <!-- Nebula cloud: warm pink-magenta core fading out -->
    <radialGradient id="gx-nebula-warm" cx="0.55" cy="0.42" r="0.32">
      <stop offset="0"    stop-color="#ff7ad1" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#b347d8" stop-opacity="0.32"/>
      <stop offset="1"    stop-color="#3a0b5a" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula cloud: cool violet-blue accent -->
    <radialGradient id="gx-nebula-cool" cx="0.32" cy="0.65" r="0.28">
      <stop offset="0"    stop-color="#6f8dff" stop-opacity="0.42"/>
      <stop offset="0.5"  stop-color="#5a3acc" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#1a1050" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gx-rim-shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.95"/>
    </radialGradient>

    <radialGradient id="gx-spec-main" cx="0.30" cy="0.22" r="0.28">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="0.45" stop-color="#ffe5ff" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gx-spec-small" cx="0.7" cy="0.78" r="0.18">
      <stop offset="0"    stop-color="#d7c0ff" stop-opacity="0.28"/>
      <stop offset="0.6"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gx-shadow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Tiny star glow used for the brightest sparkles -->
    <radialGradient id="gx-star-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff4d6" stop-opacity="0.35"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="gx-clip">
      <circle cx="160" cy="160" r="113"/>
    </clipPath>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="160" cy="175" rx="120" ry="118" fill="url(#gx-shadow)"/>

  <!-- main disc body -->
  <circle cx="160" cy="160" r="115" fill="url(#gx-body)"/>

  <!-- Nebula + stars, clipped to the disc -->
  <g clip-path="url(#gx-clip)">
    <!-- nebula clouds (slightly off-center for organic look) -->
    <rect x="45" y="45" width="230" height="230" fill="url(#gx-nebula-warm)"/>
    <rect x="45" y="45" width="230" height="230" fill="url(#gx-nebula-cool)"/>

    <!-- faint dust swirl arc -->
    <path d="M95,200 C130,165 175,175 220,135"
          stroke="#e2b8ff" stroke-opacity="0.18" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M110,225 C145,205 180,215 215,195"
          stroke="#a78bff" stroke-opacity="0.14" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- star halos -->
    <circle cx="118" cy="142" r="6"  fill="url(#gx-star-glow)"/>
    <circle cx="205" cy="118" r="5"  fill="url(#gx-star-glow)"/>
    <circle cx="172" cy="208" r="5"  fill="url(#gx-star-glow)"/>
    <circle cx="232" cy="186" r="4"  fill="url(#gx-star-glow)"/>
    <circle cx="92"  cy="178" r="4"  fill="url(#gx-star-glow)"/>

    <!-- bright star cores -->
    <circle cx="118" cy="142" r="1.5" fill="#ffffff"/>
    <circle cx="205" cy="118" r="1.4" fill="#ffffff"/>
    <circle cx="172" cy="208" r="1.4" fill="#ffffff"/>
    <circle cx="232" cy="186" r="1.1" fill="#ffffff"/>
    <circle cx="92"  cy="178" r="1.1" fill="#ffffff"/>

    <!-- scattered small stars -->
    <circle cx="135" cy="100" r="1"   fill="#ffffff" opacity="0.85"/>
    <circle cx="158" cy="125" r="0.9" fill="#ffe7ff" opacity="0.8"/>
    <circle cx="190" cy="155" r="1.1" fill="#ffffff" opacity="0.9"/>
    <circle cx="220" cy="225" r="0.9" fill="#ffe7ff" opacity="0.7"/>
    <circle cx="148" cy="240" r="1"   fill="#ffffff" opacity="0.8"/>
    <circle cx="100" cy="115" r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="80"  cy="160" r="0.9" fill="#ffe7ff" opacity="0.65"/>
    <circle cx="245" cy="155" r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="138" cy="180" r="0.7" fill="#ffffff" opacity="0.6"/>
    <circle cx="195" cy="240" r="0.8" fill="#ffffff" opacity="0.7"/>
    <circle cx="112" cy="222" r="0.7" fill="#ffe7ff" opacity="0.6"/>
    <circle cx="225" cy="98"  r="0.8" fill="#ffffff" opacity="0.75"/>
    <circle cx="78"  cy="120" r="0.6" fill="#ffffff" opacity="0.55"/>
    <circle cx="252" cy="220" r="0.7" fill="#ffffff" opacity="0.6"/>
    <circle cx="165" cy="78"  r="0.7" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- inner rim shading -->
  <circle cx="160" cy="160" r="115" fill="url(#gx-rim-shade)"/>

  <!-- top-left specular highlight (glossy gloss) -->
  <ellipse cx="120" cy="105" rx="50" ry="34" fill="url(#gx-spec-main)"/>

  <!-- subtle bottom-right counter-highlight -->
  <ellipse cx="208" cy="220" rx="32" ry="18" fill="url(#gx-spec-small)"/>

  <!-- tight white hotspot -->
  <ellipse cx="118" cy="98" rx="12" ry="6" fill="#ffffff" fill-opacity="0.7"/>

  <!-- outer rim line -->
  <circle cx="160" cy="160" r="115" fill="none" stroke="#000000" stroke-opacity="0.7" stroke-width="2"/>
</svg>
